[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-experiment-tracker"
version = "0.1.0"
description = "A local-first ML experiment tracker with FastAPI backend and Streamlit UI"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhtasim-Munif-Fahim"}]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "plotly>=5.15.0",
    "streamlit>=1.25.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.scripts]
ml-experiment-tracker = "src.api:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
